pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Lets Gradle auto-download a JDK 25 toolchain if the machine doesn't
    // have one installed - avoids "error: release version 25 not
    // supported" when only an older JDK is on PATH/JAVA_HOME.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'itemsucker'
